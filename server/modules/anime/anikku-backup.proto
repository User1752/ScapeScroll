// Schema for writing Anikku (komikku-app/anikku — the anime-only sibling of
// Komikku/Mihon) .tachibk library backups. Anikku's own Backup.kt has NO
// manga fields at all (unlike Aniyomi, which merges manga+anime in one
// schema) — it's a dedicated anime backup format, hence a separate .proto
// from mihon-import/backup.proto rather than an extension of it. Field
// numbers below are copied verbatim from Anikku's own @ProtoNumber
// annotations (komikku-app/anikku, app/src/main/java/eu/kanade/tachiyomi/
// data/backup/models/*.kt) — getting these wrong produces a file Anikku
// can't read, so only fields actually present in that source were used;
// nothing here is guessed.
syntax = "proto2";
package anikku;

message Backup {
  repeated BackupAnime backupAnime = 3;
  repeated BackupCategory backupAnimeCategories = 4;
  repeated BackupSource backupSources = 103;
}

message BackupSource {
  optional string name = 1;
  optional int64 sourceId = 2;
}

message BackupCategory {
  optional string name = 1;
  optional int64 order = 2;
}

message BackupAnime {
  optional int64 source = 1;
  optional string url = 2;
  optional string title = 3;
  optional string artist = 4;
  optional string author = 5;
  optional string description = 6;
  repeated string genre = 7;
  optional int32 status = 8;
  optional string thumbnailUrl = 9;
  optional int64 dateAdded = 13;
  repeated BackupEpisode episodes = 16;
  repeated int64 categories = 17;
  optional bool favorite = 100 [default = true];
  repeated BackupHistory history = 104;
  optional int64 lastModifiedAt = 106;
}

message BackupEpisode {
  required string url = 1;
  required string name = 2;
  optional bool seen = 4;
  optional int64 lastSecondSeen = 6;
  optional int64 totalSeconds = 16;
  optional float episodeNumber = 9;
  optional int64 sourceOrder = 10;
}

message BackupHistory {
  optional string url = 1;
  optional int64 lastRead = 2;
  optional int64 readDuration = 3;
}
